[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# Exact provider bytes are part of the pre-execution historical freeze.
# Lint, types, security and the source-hash gate still cover this file.
exclude = ["scripts/codex_policy.py"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
follow_imports = "silent"
