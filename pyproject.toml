[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entrotter-sdk"
version = "0.1.0"
description = "Typed standard-library client for the Entrotter API"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Entrotter contributors"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
