name: cli · Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cli-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Materialize preserved sdk-python history locally
        working-directory: .
        run: |
          mkdir -p cli/_deps
          git worktree add --detach cli/_deps/sdk 'ba4af512784119f23b6dea63fd24c7f5d1fdde44'
      - name: Unit tests without API keys
        run: PYTHONPATH=src:_deps/sdk/src python -m unittest discover -s tests -v

  cli-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize preserved sdk-python history locally
        working-directory: .
        run: |
          mkdir -p cli/_deps
          git worktree add --detach cli/_deps/sdk 'eb9921f30c1f0f3750140f66023e3b10d255cb20'
      - name: Materialize preserved engine history locally
        working-directory: .
        run: |
          mkdir -p cli/_deps
          git worktree add --detach cli/_deps/engine 'c1671938edde03c59deef64dbb81d7c41a33406b'
      - name: Build verified worker inputs from the pinned engine
        env:
          PYTHONPATH: _deps/engine/src
        run: |
          mkdir -p .quality
          python _deps/engine/scripts/build_worker.py --output .quality/agent-worker-image.json
      - name: Execute actual CLI risk and recorded replay with no model call
        env:
          PYTHONPATH: src:_deps/sdk/src:_deps/engine/src
        run: |
          export ENTROTTER_WORKER_IMAGE="$(python -c 'import json; print(json.load(open(".quality/agent-worker-image.json"))["image_id"])')"
          python -m unittest discover -s tests_agent -v
      - name: Confirm no experiment workers remain
        if: always()
        run: test -z "$(docker ps --all --filter label=org.entrotter.worker=true --format '{{.ID}}')"
      - name: Materialize preserved engine history locally
        working-directory: .
        run: |
          mkdir -p cli/_deps
          git worktree add --detach cli/_deps/observed-engine 'c2eb54dc97509e7318216c01f98adade1da5bc6e'
      - name: Build the matching fixed-observation worker
        env:
          PYTHONPATH: _deps/observed-engine/src
        run: python _deps/observed-engine/scripts/build_worker.py --output .quality/observed-worker-image.json
      - name: Verify actual default observed replay and cancellation through CLI and SDK
        env:
          PYTHONPATH: src:_deps/sdk/src:_deps/observed-engine/src
          ENTROTTER_DOCKER_SOCKET: /var/run/docker.sock
          ENTROTTER_RPC_URL: https://eth.drpc.org
          ENTROTTER_OBSERVED_PLAN: _deps/observed-engine/tests/data/canonical-mainnet-prefix.json
        run: |
          export ENTROTTER_WORKER_IMAGE="$(python -c 'import json; print(json.load(open(".quality/observed-worker-image.json"))["image_id"])')"
          python -m unittest discover -s tests_observed -v
      - name: Confirm no observed workers remain
        if: always()
        run: test -z "$(docker ps --all --filter label=org.entrotter.worker=true --format '{{.ID}}')"
      - name: Materialize preserved sdk-python history locally
        working-directory: .
        run: |
          mkdir -p cli/_deps
          git worktree add --detach cli/_deps/position-sdk 'ba4af512784119f23b6dea63fd24c7f5d1fdde44'
      - name: Materialize preserved engine history locally
        working-directory: .
        run: |
          mkdir -p cli/_deps
          git worktree add --detach cli/_deps/position-engine '88c6cd0d00f466ed7e870bd57c118aa50984f8b1'
      - name: Build the matching fixed-account worker
        env:
          PYTHONPATH: _deps/position-engine/src
        run: python _deps/position-engine/scripts/build_worker.py --output .quality/position-worker-image.json
      - name: Compare actual account replay and cancellation through CLI and SDK
        env:
          PYTHONPATH: src:_deps/position-sdk/src:_deps/position-engine/src
          ENTROTTER_DOCKER_SOCKET: /var/run/docker.sock
          ENTROTTER_RPC_URL: https://eth.drpc.org
          ENTROTTER_POSITION_PLAN: _deps/position-engine/tests/data/aave-account-prefix.json
          ENTROTTER_POSITION_REFERENCE: _deps/position-engine/evidence/aave-account-impact/position.json
        run: |
          export ENTROTTER_WORKER_IMAGE="$(python -c 'import json; print(json.load(open(".quality/position-worker-image.json"))["image_id"])')"
          python -m unittest discover -s tests_position -v
      - name: Confirm no account workers remain
        if: always()
        run: test -z "$(docker ps --all --filter label=org.entrotter.worker=true --format '{{.ID}}')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cli-agent-image
          path: |
            cli/.quality/agent-worker-image.json
            cli/.quality/observed-worker-image.json
            cli/.quality/observed-run/actual/
            cli/.quality/position-worker-image.json
            cli/.quality/position-cli/actual/
          include-hidden-files: true
          if-no-files-found: error
