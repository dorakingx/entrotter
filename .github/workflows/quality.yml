name: SDK quality and Python dependency audit
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install only hash-verified locked tool wheels
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r requirements-quality.txt
          .venv/bin/python -m pip check
      - name: Lint and formatting across production source and scripts
        run: |
          .venv/bin/python -m ruff check src scripts
          .venv/bin/python -m ruff format --check src scripts
      - name: Check types including unannotated function bodies
        run: .venv/bin/python -m mypy src scripts
      - name: Full security scan without suppressions
        run: |
          mkdir -p .quality
          .venv/bin/python -m bandit --ignore-nosec -r src scripts -f json -o .quality/bandit.json
          .venv/bin/python scripts/check_security.py
      - name: Verify declared dependency coverage and query Python advisories
        run: |
          .venv/bin/python scripts/check_dependency_manifest.py
          .venv/bin/python -m pip_audit --strict --require-hashes --disable-pip -r requirements-quality.txt --progress-spinner off -f json -o .quality/dependencies.json
      - name: Build wheel with the pinned build dependency
        run: .venv/bin/python -m build --no-isolation --wheel --outdir .quality/wheels
      - name: Verify typed SDK wheel in an isolated fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/sdk-wheel-venv"
          "$RUNNER_TEMP/sdk-wheel-venv/bin/python" -m pip install --no-index --no-deps .quality/wheels/*.whl
          "$RUNNER_TEMP/sdk-wheel-venv/bin/python" -I -c 'import entrotter_sdk, importlib.resources; from pathlib import Path; import sys; assert Path(entrotter_sdk.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()); assert importlib.resources.files("entrotter_sdk").joinpath("py.typed").is_file(); assert entrotter_sdk.Client().base_url == "http://127.0.0.1:8787"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sdk-python-quality-reports
          path: .quality/
          include-hidden-files: true
          if-no-files-found: error
