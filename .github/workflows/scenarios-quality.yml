name: scenarios · Scenario Python quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scenarios-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scenarios
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize preserved engine history locally
        working-directory: .
        run: |
          mkdir -p scenarios/_deps
          git worktree add --detach scenarios/_deps/engine 'bb8b3e8d32c7cbd49629d337758f30bfdf805045'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install complete hash-locked development tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r requirements-quality.txt
          .venv/bin/python -m pip check
      - name: Lint, format, type and scan every tracked Python source including tests
        env:
          MYPYPATH: _deps/engine/src
        run: |
          set -euo pipefail
          mkdir -p .quality
          git ls-files -z '*.py' > .quality/python-files.bin
          mapfile -d '' sources < .quality/python-files.bin
          test "${#sources[@]}" -gt 0
          sha256sum "${sources[@]}" schemas/*.json requirements-*.txt > .quality/source-sha256.txt
          .venv/bin/python -m ruff check "${sources[@]}"
          .venv/bin/python -m ruff format --check "${sources[@]}"
          .venv/bin/python -m mypy "${sources[@]}" | tee .quality/types.log
          .venv/bin/python -m bandit --ignore-nosec -f json -o .quality/security.json "${sources[@]}"
      - name: Audit all locked development packages, including schema dependencies
        run: |
          .venv/bin/python -m pip_audit --strict --require-hashes --disable-pip -r requirements-quality.txt --progress-spinner off -f json -o .quality/dependencies.json
          .venv/bin/python -m pip_audit --strict --require-hashes --disable-pip -r requirements-dev.txt --progress-spinner off -f json -o .quality/contracts-dependencies.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scenario-quality-reports
          path: scenarios/.quality/
          include-hidden-files: true
          if-no-files-found: error
