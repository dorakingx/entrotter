name: Isolated worker enforcement
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      ENTROTTER_DOCKER_SOCKET: /var/run/docker.sock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.3
      - name: Build local worker from digest-verified inputs
        run: |
          python scripts/build_worker.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          image = json.loads(Path('worker-image.json').read_text())['image_id']
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ENTROTTER_WORKER_IMAGE=' + image + '\n')
          PY
      - name: Verify real kernel enforcement, API and lifetime cleanup
        run: python -m unittest discover -s tests_isolated -v
      - name: Replay pinned mainnet transaction through the default bounded worker
        env:
          ENTROTTER_RPC_URL: https://eth.drpc.org
        run: |
          python -m entrotter_engine trace-run tests/data/canonical-mainnet-prefix.json -o .quality/trace-replay/mainnet-prefix.json
          python - <<'PY'
          import json
          from pathlib import Path
          from entrotter_engine.trace import verify_trace
          report = json.loads(Path('.quality/trace-replay/mainnet-prefix.json').read_text())
          if not verify_trace(report) or not report['baseline_verified']:
              raise RuntimeError('Pinned mainnet receipt replay did not verify; no fixture substitution')
          receipt = report['baseline']['outcomes'][0]['receipt']
          if receipt['gasUsed'] != '0x32d10' or len(receipt['logs']) != 8:
              raise RuntimeError('Pinned transaction execution differs from original receipt')
          print(json.dumps({'artifact_id': report['artifact_id'], 'runtime_seconds': report['runtime_seconds'], 'gas_used': 208144, 'log_count': 8}))
          PY
      - name: Verify no test workers remain
        if: always()
        run: |
          workers=$(docker ps --all --filter label=org.entrotter.worker=true --format '{{.ID}}')
          test -z "$workers"
      - name: Verify base signature and audit every detected worker package
        run: python scripts/check_image_security.py --manifest worker-image.json --output .quality/image-security
      - name: Verify native release provenance and signed Cargo inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_native_security.py --manifest worker-image.json --output .quality/native-security
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: worker-image-security
          path: |
            .quality/image-security/
            .quality/native-security/
            .quality/build-output-docker.json
            .quality/trace-replay/
            worker-image.json
          include-hidden-files: true
          if-no-files-found: error
