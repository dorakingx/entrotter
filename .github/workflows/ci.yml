name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/sdk-python
          ref: eb9921f30c1f0f3750140f66023e3b10d255cb20
          path: _deps/sdk
      - name: Unit tests without API keys
        run: PYTHONPATH=src:_deps/sdk/src python -m unittest discover -s tests -v

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/sdk-python
          ref: eb9921f30c1f0f3750140f66023e3b10d255cb20
          path: _deps/sdk
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/engine
          ref: c1671938edde03c59deef64dbb81d7c41a33406b
          path: _deps/engine
      - name: Build verified worker inputs from the pinned engine
        env:
          PYTHONPATH: _deps/engine/src
        run: |
          mkdir -p .quality
          python _deps/engine/scripts/build_worker.py --output .quality/agent-worker-image.json
      - name: Execute actual CLI risk and recorded replay with no model call
        env:
          PYTHONPATH: src:_deps/sdk/src:_deps/engine/src
        run: |
          export ENTROTTER_WORKER_IMAGE="$(python -c 'import json; print(json.load(open(".quality/agent-worker-image.json"))["image_id"])')"
          python -m unittest discover -s tests_agent -v
      - name: Confirm no experiment workers remain
        if: always()
        run: test -z "$(docker ps --all --filter label=org.entrotter.worker=true --format '{{.ID}}')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cli-agent-image
          path: .quality/agent-worker-image.json
          if-no-files-found: error
