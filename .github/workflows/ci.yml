name: Workspace integration
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/entrotter
          path: entrotter
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/engine
          ref: bb8b3e8d32c7cbd49629d337758f30bfdf805045
          path: engine
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/sdk-python
          ref: f65f45de26c2658e2269a02a5dbe7c90c74b1cba
          path: sdk-python
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/cli
          ref: b6a7f4d96cec08f4779968b9f63bab3f9b405fe8
          path: cli
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/scenarios
          ref: 5b718984ac67b8fb49e02f4dab676ae212d2aa58
          path: scenarios
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/entrotter.github.io
          ref: ab121348b0ffbec5650f9eadf0a0b11f639d9780
          path: entrotter.github.io
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r entrotter/requirements-contracts.txt
      - run: python entrotter/scripts/verify.py --require-anvil
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-evidence
          path: entrotter/evidence/
  host-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: entrotter
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/engine
          ref: 80e8ce2386812daa8f6150048f84ab316624cc0d
          path: engine
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/sdk-python
          ref: ee5523ded16488af32d1f64040f1996cd002f8f3
          path: sdk-python
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/cli
          ref: aba6a6147b2b4b96facf758f9b95b63d8e6b5952
          path: cli
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.3
      - name: Verify CLI-SDK-API success, quota errors and connection recovery
        run: PYTHONPATH=engine/src:sdk-python/src:cli/src python entrotter/scripts/check_host_limits.py --output entrotter/evidence/host-limits-ci.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-limits-evidence
          path: entrotter/evidence/host-limits-ci.json
          if-no-files-found: error
  bounded-default:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: engine/src:sdk-python/src:cli/src
      ENTROTTER_DOCKER_SOCKET: /var/run/docker.sock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: entrotter
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/engine
          ref: 935558a5b95755c72ca6fb24f076b3a231fa5b64
          path: engine
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/sdk-python
          ref: ee5523ded16488af32d1f64040f1996cd002f8f3
          path: sdk-python
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/cli
          ref: 22b514cbba2ecd0c41ae99c330f8396c97acebf2
          path: cli
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/entrotter.github.io
          ref: b7c20ce2c080427fe0742a1afcb5dbc49277de70
          path: entrotter.github.io
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify offline reader and viewer retain the actual signed-prefix evidence
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from entrotter_sdk import load_trace
          files = [
              Path('entrotter/evidence/canonical-mine-integration/bounded-mainnet-prefix-four.json'),
              Path('sdk-python/tests/data/canonical-mainnet-prefix-four.result.json'),
              Path('entrotter.github.io/reports/trace-mainnet-prefix-four.json'),
          ]
          digest = '1bc41a9375017d601f0a8a027ca59977afedbbb109f5089b5b09eaac3f831db2'
          assert all(hashlib.sha256(p.read_bytes()).hexdigest() == digest for p in files)
          report = load_trace(files[0])
          rows = report.transactions
          assert report.baseline_verified
          assert [r.original_receipt.gas_used for r in rows] == [208144, 234720, 175305, 178980]
          assert [len(r.original_receipt.logs) for r in rows] == [8, 10, 6, 8]
          assert [r.candidate.status for r in rows] == ['skipped', 'executed', 'executed', 'nonce_conflict']
          assert rows[1].candidate.receipt.gas_used == 245136
          assert rows[2].candidate.receipt.gas_used == 185721
          assert rows[3].candidate.expected_nonce == 5522 and rows[3].candidate.original_nonce == 5523
          out = Path('entrotter/evidence/bounded-agent-integration/integration-ci/trace-reader.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({
              'status': 'passed', 'execution': 'offline original-report inspection; no new chain/model call',
              'pins': json.loads(Path('entrotter/bounded-worker-pins.json').read_text()),
              'artifact_id': report.artifact_id, 'report_sha256': digest,
              'identical_report_files': [str(p) for p in files],
              'baseline_verified': report.baseline_verified,
              'candidate_statuses': [r.candidate.status for r in rows],
              'candidate_gas': [r.candidate.receipt.gas_used if r.candidate.receipt else None for r in rows],
              'nonce_conflict': {'original': 5523, 'expected': 5522},
              'limits': ['Checksum/internal consistency is not authenticity/EVM truth.',
                         'Browser behavior is tested by the separate exact-head viewer CI.'],
          }, indent=2) + '\n')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Inspect the synthetic same-block funding report with SDK and viewer
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          from entrotter_sdk import load_trace
          source = Path('engine/evidence/trace-funding-admission/synthetic-prefix.json')
          digest = 'fbfed29e8e25c069ba74a5b405f828543213a88a8dc913e15e2dc9b89806e28f'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == digest
          report = load_trace(source)
          assert report.baseline_verified
          assert [r.baseline.status for r in report.transactions] == ['executed', 'executed']
          assert [r.baseline.receipt.gas_used for r in report.transactions] == [21000, 21000]
          assert [r.baseline.receipt.cumulative_gas_used for r in report.transactions] == [21000, 42000]
          assert [r.candidate.status for r in report.transactions] == ['skipped', 'not_mined']
          assert all(r.candidate.receipt is None for r in report.transactions)
          module = Path('entrotter.github.io/trace-report.mjs')
          program = """
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const {validateTraceReport} = await import(process.argv[1]);
          const view = await validateTraceReport(JSON.parse(fs.readFileSync(process.argv[2], 'utf8')));
          assert.equal(view.baseline.matches, true);
          assert.deepEqual(view.baseline.rows.map(r => r.receipt.gasUsed), ['0x5208', '0x5208']);
          assert.deepEqual(view.baseline.rows.map(r => r.receipt.cumulativeGasUsed), ['0x5208', '0xa410']);
          assert.deepEqual(view.candidate.rows.map(r => r.status), ['skipped', 'not_mined']);
          assert(view.candidate.rows.every(r => r.receipt === null));
          console.log(JSON.stringify({status: 'passed', artifact_id: view.report.artifact_id, node: process.version}));
          """
          completed = subprocess.run(['node', '--input-type=module', '-e', program,
                                      module.resolve().as_uri(), str(source)],
                                     check=True, capture_output=True, text=True, timeout=30)
          viewer = json.loads(completed.stdout)
          assert viewer['artifact_id'] == report.artifact_id
          out = Path('entrotter/evidence/bounded-agent-integration/integration-ci/trace-funding-reader.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({
              'status': 'passed', 'execution': 'offline synthetic report inspection; no new EVM/model call',
              'pins': json.loads(Path('entrotter/bounded-worker-pins.json').read_text()),
              'report_sha256': digest, 'artifact_id': report.artifact_id,
              'viewer_module_sha256': hashlib.sha256(module.read_bytes()).hexdigest(),
              'baseline_gas': [21000, 21000], 'baseline_cumulative_gas': [21000, 42000],
              'candidate_statuses': ['skipped', 'not_mined'], 'candidate_receipts': [None, None],
              'viewer': viewer,
              'limits': ['Native synthetic source; not archived funding or host default-worker execution proof.',
                         'Viewer codec inspection is separate from rendered browser verification.',
                         'Checksum/internal consistency is not authenticity/EVM truth.'],
          }, indent=2) + '\n')
          PY
      - name: Build source-bound local image
        run: |
          mkdir -p entrotter/evidence/bounded-agent-integration/integration-ci
          python engine/scripts/build_worker.py --output entrotter/evidence/bounded-agent-integration/integration-ci/image.json
          python - <<'PY'
          import json, os
          image = json.load(open('entrotter/evidence/bounded-agent-integration/integration-ci/image.json'))['image_id']
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ENTROTTER_WORKER_IMAGE=' + image + '\n')
              output.write('ENTROTTER_EXPORT_STATE_DIR=' + os.path.join(os.environ['RUNNER_TEMP'], 'entrotter-export-state') + '\n')
          PY
      - name: Verify shared daemon admission, default CLI-SDK-API, preservation and quotas
        run: python entrotter/scripts/check_host_limits.py --worker-manifest entrotter/evidence/bounded-agent-integration/integration-ci/image.json --output entrotter/evidence/bounded-agent-integration/integration-ci/integration.json
      - name: Verify shared export accounting across real CLI processes
        run: python entrotter/scripts/check_export_budget.py --output entrotter/evidence/bounded-agent-integration/integration-ci/export-contract.json
      - name: Verify export failures still reject under Python optimization
        run: python -O entrotter/scripts/check_export_budget.py --output entrotter/evidence/bounded-agent-integration/integration-ci/optimized-export-contract.json
      - name: Measure a clean public checkout with the bounded default
        run: python entrotter/scripts/reproduce_clean.py --bounded --output entrotter/evidence/bounded-agent-integration/integration-ci/clean-fixture.json
      - name: Measure clean public bounded agent replay and standalone CLI verification
        run: python entrotter/scripts/reproduce_clean.py --bounded-agent --output entrotter/evidence/bounded-agent-integration/integration-ci/clean-agent.json
      - name: Verify no owned worker remains
        if: always()
        run: |
          workers=$(docker ps --all --filter label=org.entrotter.worker=true --format '{{.ID}}')
          test -z "$workers"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coordination-integration-evidence
          path: |
            entrotter/evidence/bounded-agent-integration/integration-ci/
          if-no-files-found: error
