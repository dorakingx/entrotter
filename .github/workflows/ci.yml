            trace_artifact_id: observed.trace.report.artifact_id,
            profile: observed.wrapper.profile,
            classification: observed.classification,
            phases: observed.wrapper.observations.map((row, i) => ({
              branch: row.branch, phase: row.phase,
              consumer_price: observed.phases[i].price,
              producer_answer: observed.phases[i].latest_round_data.answer,
              source: observed.phases[i].source, aggregator: observed.phases[i].aggregator,
              base_currency: observed.phases[i].base_currency, base_unit: observed.phases[i].base_unit,
              head: row.head, code_identities: row.code,
            })),
          };
          console.log(JSON.stringify({artifact_id: view.report.artifact_id, counts, classifications,
            node: process.version, direct_observation}, (_, value) => typeof value === 'bigint' ? value.toString() : value));
          """
          completed = subprocess.run(['node', '--input-type=module', '-e', program,
                                      module.resolve().as_uri(), comparison.resolve().as_uri(), str(exported),
                                      observer_module.resolve().as_uri(), str(viewer_record)],
