              'aggregator': '0x' + row['raw']['aggregator'][26:].lower(),
              'base_currency': '0x' + row['raw']['base_currency'][26:].lower(),
              'base_unit': str(int(row['raw']['base_unit'], 16)),
          } for price, row in zip(prices, observed['observations'])]
          out.write_text(json.dumps({
              'status': 'passed', 'execution': 'offline supported sealed wrapper to normal quota-bound report export, SDK and actual Node viewer; no fresh archive/EVM/model/browser call',
              'pins': json.loads(Path('entrotter/bounded-worker-pins.json').read_text()),
              'wrapper_sha256': digest, 'wrapper_artifact_id': observed['artifact_id'],
              'trace_artifact_id': report.artifact_id, 'export_sha256': export_digest,
              'baseline_receipts_equal_originals': 32, 'candidate_executed': 31, 'skip_indices': [12],
              'consumer_classification': observed['classification'], 'prices': prices,
              'viewer_module_sha256': hashlib.sha256(module.read_bytes()).hexdigest(),
              'comparison_module_sha256': hashlib.sha256(comparison.read_bytes()).hexdigest(), 'viewer': viewer,
              'observed_viewer_module_sha256': hashlib.sha256(observer_module.read_bytes()).hexdigest(),
              'viewer_observation': direct,
              'cli_module_sha256': hashlib.sha256(cli_module.read_bytes()).hexdigest(),
              'cli_observation': cli_records,
              'sdk_observed_module_sha256': hashlib.sha256(sdk_module.read_bytes()).hexdigest(),
              'sdk_observation': {'artifact_id': sdk_observed.artifact_id, 'profile': sdk_observed.profile,
                                  'classification': sdk_classification, 'phases': sdk_phases},
              'limits': ['Strict wrapper validation and offline parsing do not authenticate provider/deployed state.',
                         'Read-only price views are not signed consumer strategy or profit;32-of181 is not full-block/root/opcode proof.',
                         'SDK, CLI and viewer additionally inspect recorded wrapper price views and exact typed records.',
                         'Node codec checks are separate from rendered browser/Pages verification and real Docker execution.'],
          }, indent=2) + '\n')
