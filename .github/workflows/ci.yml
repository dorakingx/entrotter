name: Workspace integration
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: entrotter/entrotter
          path: entrotter
      - uses: actions/checkout@v4
        with:
          repository: entrotter/engine
          path: engine
      - uses: actions/checkout@v4
        with:
          repository: entrotter/sdk-python
          path: sdk-python
      - uses: actions/checkout@v4
        with:
          repository: entrotter/cli
          path: cli
      - uses: actions/checkout@v4
        with:
          repository: entrotter/scenarios
          path: scenarios
      - uses: actions/checkout@v4
        with:
          repository: entrotter/entrotter.github.io
          path: entrotter.github.io
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pip install -r scenarios/requirements-dev.txt
      - run: python entrotter/scripts/verify.py --require-anvil
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: entrotter/evidence/
