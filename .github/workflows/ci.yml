name: Workspace integration
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/entrotter
          path: entrotter
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/engine
          ref: bb8b3e8d32c7cbd49629d337758f30bfdf805045
          path: engine
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/sdk-python
          ref: f65f45de26c2658e2269a02a5dbe7c90c74b1cba
          path: sdk-python
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/cli
          ref: b6a7f4d96cec08f4779968b9f63bab3f9b405fe8
          path: cli
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/scenarios
          ref: 5b718984ac67b8fb49e02f4dab676ae212d2aa58
          path: scenarios
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/entrotter.github.io
          ref: ab121348b0ffbec5650f9eadf0a0b11f639d9780
          path: entrotter.github.io
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r entrotter/requirements-contracts.txt
      - run: python entrotter/scripts/verify.py --require-anvil
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-evidence
          path: entrotter/evidence/
  host-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: entrotter
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/engine
          ref: 80e8ce2386812daa8f6150048f84ab316624cc0d
          path: engine
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/sdk-python
          ref: ee5523ded16488af32d1f64040f1996cd002f8f3
          path: sdk-python
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/cli
          ref: aba6a6147b2b4b96facf758f9b95b63d8e6b5952
          path: cli
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.3
      - name: Verify CLI-SDK-API success, quota errors and connection recovery
        run: PYTHONPATH=engine/src:sdk-python/src:cli/src python entrotter/scripts/check_host_limits.py --output entrotter/evidence/host-limits-ci.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-limits-evidence
          path: entrotter/evidence/host-limits-ci.json
          if-no-files-found: error
  bounded-default:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: engine/src:sdk-python/src:cli/src
      ENTROTTER_DOCKER_SOCKET: /var/run/docker.sock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: entrotter
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/engine
          ref: 40bea57e25ab94c0d0f6136b4c3a5af4a99e6a1d
          path: engine
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/sdk-python
          ref: ee5523ded16488af32d1f64040f1996cd002f8f3
          path: sdk-python
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/cli
          ref: 22b514cbba2ecd0c41ae99c330f8396c97acebf2
          path: cli
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/entrotter.github.io
          ref: a19d3b17fcf44e58a237b622de8cef89842eb6e7
          path: entrotter.github.io
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify offline reader and viewer retain the actual signed-prefix evidence
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from entrotter_sdk import load_trace
          files = [
              Path('entrotter/evidence/canonical-mine-integration/bounded-mainnet-prefix-four.json'),
              Path('sdk-python/tests/data/canonical-mainnet-prefix-four.result.json'),
              Path('entrotter.github.io/reports/trace-mainnet-prefix-four.json'),
          ]
          digest = '1bc41a9375017d601f0a8a027ca59977afedbbb109f5089b5b09eaac3f831db2'
          assert all(hashlib.sha256(p.read_bytes()).hexdigest() == digest for p in files)
          report = load_trace(files[0])
          rows = report.transactions
          assert report.baseline_verified
          assert [r.original_receipt.gas_used for r in rows] == [208144, 234720, 175305, 178980]
          assert [len(r.original_receipt.logs) for r in rows] == [8, 10, 6, 8]
          assert [r.candidate.status for r in rows] == ['skipped', 'executed', 'executed', 'nonce_conflict']
          assert rows[1].candidate.receipt.gas_used == 245136
          assert rows[2].candidate.receipt.gas_used == 185721
          assert rows[3].candidate.expected_nonce == 5522 and rows[3].candidate.original_nonce == 5523
          out = Path('entrotter/evidence/bounded-agent-integration/integration-ci/trace-reader.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({
              'status': 'passed', 'execution': 'offline original-report inspection; no new chain/model call',
              'pins': json.loads(Path('entrotter/bounded-worker-pins.json').read_text()),
              'artifact_id': report.artifact_id, 'report_sha256': digest,
              'identical_report_files': [str(p) for p in files],
              'baseline_verified': report.baseline_verified,
              'candidate_statuses': [r.candidate.status for r in rows],
              'candidate_gas': [r.candidate.receipt.gas_used if r.candidate.receipt else None for r in rows],
              'nonce_conflict': {'original': 5523, 'expected': 5522},
              'limits': ['Checksum/internal consistency is not authenticity/EVM truth.',
                         'Browser behavior is tested by the separate exact-head viewer CI.'],
          }, indent=2) + '\n')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Inspect the original 32-receipt case and display classification with SDK and viewer
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from dataclasses import replace
          from pathlib import Path
          from entrotter_sdk import load_trace
          source = Path('engine/evidence/trace-parent-cache/native-005/report.json')
          fixture = Path('entrotter.github.io/tests/data/trace-oracle-prefix-32.json')
          digest = '72b9765731a77c06df1200a2dcf46f74cb7f512758ab35029ae9cef2c6ef2120'
          assert source.read_bytes() == fixture.read_bytes()
          assert hashlib.sha256(source.read_bytes()).hexdigest() == digest
          report = load_trace(source)
          rows = report.transactions
          assert report.baseline_verified and len(rows) == 32
          assert report.report['plan']['skip_indices'] == [12]
          assert report.report['plan']['through_index'] == 31
          assert report.report['source']['block_transaction_count'] == 181
          omitted_gas = rows[12].original_receipt.gas_used
          assert omitted_gas == 336752
          for i, row in enumerate(rows):
              assert row.baseline.status == 'executed'
              assert row.baseline.receipt == row.original_receipt
              if i == 12:
                  assert row.candidate.status == 'skipped' and row.candidate.receipt is None
                  continue
              assert row.candidate.status == 'executed'
              expected = row.original_receipt if i < 12 else replace(
                  row.original_receipt,
                  transaction_index=row.original_receipt.transaction_index - 1,
                  cumulative_gas_used=row.original_receipt.cumulative_gas_used - omitted_gas,
              )
              assert row.candidate.receipt == expected
              assert row.candidate.differing_fields == (() if i < 12 else ('cumulativeGasUsed', 'transactionIndex'))
          module = Path('entrotter.github.io/trace-report.mjs')
          classification = Path('entrotter.github.io/trace-comparison.mjs')
          program = """
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const {validateTraceReport} = await import(process.argv[1]);
          const {traceComparison} = await import(process.argv[2]);
          const view = await validateTraceReport(JSON.parse(fs.readFileSync(process.argv[3], 'utf8')));
          assert.equal(view.baseline.matches, true);
          assert.equal(view.candidate.rows.length, 32);
          const counts = {identical: 0, omitted: 0, structural: 0, execution: 0, unavailable: 0};
          const classifications = view.candidate.rows.map((row, i) => {
            const group = traceComparison(row);
            assert.equal(group.kind, i < 12 ? 'identical' : i === 12 ? 'omitted' : 'structural');
            assert.deepEqual(group.structuralFields, i > 12 ? ['cumulativeGasUsed', 'transactionIndex'] : []);
            assert.deepEqual(group.executionFields, []);
            counts[group.kind] += 1;
            return {index: row.index, status: row.status, differing_fields: row.differing_fields, ...group};
          });
          assert.deepEqual(counts, {identical: 12, omitted: 1, structural: 19, execution: 0, unavailable: 0});
          console.log(JSON.stringify({status: 'passed', artifact_id: view.report.artifact_id, node: process.version,
                                     counts, classifications}));
          """
          completed = subprocess.run(['node', '--input-type=module', '-e', program,
                                      module.resolve().as_uri(), classification.resolve().as_uri(), str(source)],
                                     check=True, capture_output=True, text=True, timeout=30)
          viewer = json.loads(completed.stdout)
          assert viewer['artifact_id'] == report.artifact_id
          out = Path('entrotter/evidence/bounded-agent-integration/integration-ci/trace-comparison-reader.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({
              'status': 'passed', 'execution': 'offline original32 report inspection; no new EVM/archive/model call',
              'pins': json.loads(Path('entrotter/bounded-worker-pins.json').read_text()),
              'report_sha256': digest, 'artifact_id': report.artifact_id,
              'viewer_module_sha256': hashlib.sha256(module.read_bytes()).hexdigest(),
              'classification_module_sha256': hashlib.sha256(classification.read_bytes()).hexdigest(),
              'baseline_verified': report.baseline_verified, 'input_count': 32, 'block_transaction_count': 181,
              'through_index': 31, 'skip_indices': [12], 'omitted_gas': omitted_gas,
              'baseline_receipts_equal_originals': True,
              'candidate_receipts_equal_originals_except_exact_omission_shifts': True,
              'viewer': viewer,
              'limits': ['Display classification preserves original differences; receipt identity is not contract-state or economic identity.',
                         'Recorded native producer prefix is not dependent-consumer/profit/full-block/provider-authenticity proof.',
                         'Browser behavior and actual native execution retain their separately pinned evidence.'],
          }, indent=2) + '\n')
          PY
      - name: Inspect the historical Aave consumer price records with SDK and viewer
        run: |
          python - <<'PY'
          from dataclasses import replace
          import hashlib,json,subprocess
          from pathlib import Path
          from entrotter_sdk import load_trace
          source = Path('engine/evidence/aave-consumer-price/native-006/report.json')
          digest = '2e4cc3966185ed92f40b3507a397269ad44d098a65b8bf2dcb57b331f33a2d79'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == digest
          report = load_trace(source)
          rows = report.transactions
          assert report.baseline_verified and len(rows) == 32
          assert report.report['plan']['skip_indices'] == [12]
          assert report.report['plan']['through_index'] == 31
          assert report.report['source']['block_transaction_count'] == 181
          omitted_gas = rows[12].original_receipt.gas_used
          assert omitted_gas == 336752
          for i, row in enumerate(rows):
              assert row.baseline.status == 'executed'
              assert row.baseline.receipt == row.original_receipt
              if i == 12:
                  assert row.candidate.status == 'skipped' and row.candidate.receipt is None
                  continue
              assert row.candidate.status == 'executed'
              expected = row.original_receipt if i < 12 else replace(
                  row.original_receipt,
                  transaction_index=row.original_receipt.transaction_index - 1,
                  cumulative_gas_used=row.original_receipt.cumulative_gas_used - omitted_gas,
              )
              assert row.candidate.receipt == expected
              assert row.candidate.differing_fields == (() if i < 12 else ('cumulativeGasUsed', 'transactionIndex'))
          module = Path('entrotter.github.io/trace-report.mjs')
          classification = Path('entrotter.github.io/trace-comparison.mjs')
          program = """
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const {validateTraceReport} = await import(process.argv[1]);
          const {traceComparison} = await import(process.argv[2]);
          const view = await validateTraceReport(JSON.parse(fs.readFileSync(process.argv[3], 'utf8')));
          assert.equal(view.baseline.matches, true);
          assert.equal(view.candidate.rows.length, 32);
          const counts = {identical: 0, omitted: 0, structural: 0, execution: 0, unavailable: 0};
          const classifications = view.candidate.rows.map((row, i) => {
            const group = traceComparison(row);
            assert.equal(group.kind, i < 12 ? 'identical' : i === 12 ? 'omitted' : 'structural');
            assert.deepEqual(group.structuralFields, i > 12 ? ['cumulativeGasUsed', 'transactionIndex'] : []);
            assert.deepEqual(group.executionFields, []);
            counts[group.kind] += 1;
            return {index: row.index, status: row.status, differing_fields: row.differing_fields, ...group};
          });
          assert.deepEqual(counts, {identical: 12, omitted: 1, structural: 19, execution: 0, unavailable: 0});
          console.log(JSON.stringify({status: 'passed', artifact_id: view.report.artifact_id, node: process.version,
                                     counts, classifications}));
          """
          completed = subprocess.run(['node', '--input-type=module', '-e', program,
                                      module.resolve().as_uri(), classification.resolve().as_uri(), str(source)],
                                     check=True, capture_output=True, text=True, timeout=30)
          viewer = json.loads(completed.stdout)
          assert viewer['artifact_id'] == report.artifact_id

          import sys
          root = source.parent.parent
          helper = root / 'harness' / 'consumer_observer.py'
          assert hashlib.sha256(helper.read_bytes()).hexdigest() == 'b2279b48b2c51522675bbb991532ec9505089ddf614134d9aa5ff5ddf3bb2fea'
          sys.path.insert(0, str(root / 'harness'))
          from consumer_observer import ConsumerObserver, address, uint, PHASES, UNIT, ZERO, PROXY
          decoder_helper = root / 'harness' / 'native_runner.py'
          assert hashlib.sha256(decoder_helper.read_bytes()).hexdigest() == '8846ff9a465e83c6c42e7684992cb0fa4e86764603077a25d90e3e4a9d87e2b4'
          from native_runner import decode
          consumer_source = root / 'native-006' / 'consumer-observations.json'
          producer_source = root / 'native-006' / 'observations.json'
          request_source = root / 'native-006' / 'worker-request.json'
          request_digest = hashlib.sha256(request_source.read_bytes()).hexdigest()
          assert request_digest == 'c9df77e46ca56d8b0e9a72e38fab1fd4013d84abe1e082619641850bf7feb522'
          assert json.loads(request_source.read_text())['trace'] == report.report['plan']
          assert hashlib.sha256(consumer_source.read_bytes()).hexdigest() == 'b9e979c9f363559c5ab79131b602b7b7538da84f2c19928c089219b00dcc831d'
          assert hashlib.sha256(producer_source.read_bytes()).hexdigest() == '87c9f0d430ab5db09cd1bb3f92b910b6cd4f90955bd3f7d5c45204caa306a25b'
          consumer = json.loads(consumer_source.read_text())
          producer = json.loads(producer_source.read_text())
          assert consumer['request_id'] == request_digest
          assert len(consumer['rows']) == len(producer) == 4
          producer_rows = {(row['branch'], row['phase']): row for row in producer}
          consumer_rows = {(row['branch'], row['phase']): row for row in consumer['rows']}
          assert set(producer_rows) == set(consumer_rows) == PHASES
          codes = {'oracle_code': set(), 'proxy_code': set()}
          prices = {}
          for key in sorted(PHASES):
              row, feed = consumer_rows[key], producer_rows[key]
              assert not row['errors'] and not feed['errors']
              assert set(row['raw']) == set(row['decoded']) == {'source', 'price', 'base_currency', 'base_unit'}
              assert set(row['code']) == set(codes)
              for name, value in row['raw'].items():
                  decoder = address if name in ('source', 'base_currency') else uint
                  assert decoder(value) == row['decoded'][name]
              assert row['decoded']['source'] == PROXY
              assert row['decoded']['base_currency'] == ZERO and row['decoded']['base_unit'] == UNIT
              for name in ('latestRoundData', 'aggregator'):
                  assert decode(name, feed['values'][name]) == feed['decoded'][name]
              assert row['decoded']['price'] == feed['decoded']['latestRoundData']['answer']
              head = feed['values']['head']
              assert int(head['number'], 16) == report.report['source']['parent']['block_number'] + (key[1] == 'after')
              if key[1] == 'before':
                  assert head['hash'] == report.report['source']['parent']['block_hash']
              else:
                  assert int(head['timestamp'], 16) == report.report['source']['header']['timestamp']
              for name, identity in row['code'].items():
                  assert set(identity) == {'bytes', 'sha256', 'nonempty'} and identity['nonempty'] is True
                  assert type(identity['bytes']) is int and 0 < identity['bytes'] <= 65536
                  assert len(bytes.fromhex(identity['sha256'])) == 32
                  codes[name].add((identity['bytes'], identity['sha256']))
              prices['_'.join(key)] = row['decoded']['price']
          assert all(len(values) == 1 for values in codes.values())
          assert producer_rows['baseline', 'before']['values'] == producer_rows['candidate', 'before']['values']
          assert prices == {'baseline_before': 257082415000, 'baseline_after': 256292441874,
                            'candidate_before': 257082415000, 'candidate_after': 257082415000}
          checker = ConsumerObserver(Path('.'), request_digest)
          checker.rows = consumer['rows']
          observed = checker.classify(producer, report.baseline_verified)
          assert observed['owned_read_only_price_observation_complete'] is True and observed['unproven_reasons'] == []
          out = Path('entrotter/evidence/bounded-agent-integration/integration-ci/trace-consumer-reader.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({
              'status': 'passed', 'execution': 'Offline native006 report and separate owned view records; no new EVM/archive/model/browser call',
              'pins': json.loads(Path('entrotter/bounded-worker-pins.json').read_text()),
              'report_sha256': digest, 'artifact_id': report.artifact_id,
              'consumer_observations_sha256': hashlib.sha256(consumer_source.read_bytes()).hexdigest(),
              'producer_observations_sha256': hashlib.sha256(producer_source.read_bytes()).hexdigest(),
              'request_sha256': request_digest, 'helper_sha256': hashlib.sha256(helper.read_bytes()).hexdigest(),
              'decoder_helper_sha256': hashlib.sha256(decoder_helper.read_bytes()).hexdigest(),
              'viewer_module_sha256': hashlib.sha256(module.read_bytes()).hexdigest(),
              'classification_module_sha256': hashlib.sha256(classification.read_bytes()).hexdigest(),
              'baseline_verified': report.baseline_verified, 'input_count': 32, 'block_transaction_count': 181,
              'through_index': 31, 'skip_indices': [12], 'omitted_gas': omitted_gas,
              'baseline_receipts_equal_originals': True,
              'candidate_receipts_equal_originals_except_exact_omission_shifts': True,
              'consumer_raw_ABI_matches_decoded': True, 'producer_raw_ABI_matches_decoded': True,
              'initial_owned_heads_equal_pinned_parent': True, 'post_headers_equal_pinned_number_timestamp': True,
              'consumer_prices': prices, 'stable_returned_code_identities': {name: list(values)[0] for name, values in codes.items()},
              'consumer_classification': observed, 'consumer_records': consumer['rows'], 'viewer': viewer,
              'limits': ['Parsing recorded bytes does not constitute a fresh archive execution or prove provider/deployed-code authenticity.',
                         'Read-only price dependence is separate from signed consumer transactions, strategies, profit and full G1.',
                         'Node parsing is not rendered browser/Pages verification; standard trace report remains unchanged.'],
          }, indent=2) + '\n')
          PY
      - name: Inspect the synthetic same-block funding report with SDK and viewer
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          from entrotter_sdk import load_trace
          source = Path('engine/evidence/trace-funding-admission/synthetic-prefix.json')
          digest = 'fbfed29e8e25c069ba74a5b405f828543213a88a8dc913e15e2dc9b89806e28f'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == digest
          report = load_trace(source)
          assert report.baseline_verified
          assert [r.baseline.status for r in report.transactions] == ['executed', 'executed']
          assert [r.baseline.receipt.gas_used for r in report.transactions] == [21000, 21000]
          assert [r.baseline.receipt.cumulative_gas_used for r in report.transactions] == [21000, 42000]
          assert [r.candidate.status for r in report.transactions] == ['skipped', 'not_mined']
          assert all(r.candidate.receipt is None for r in report.transactions)
          module = Path('entrotter.github.io/trace-report.mjs')
          program = """
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const {validateTraceReport} = await import(process.argv[1]);
          const view = await validateTraceReport(JSON.parse(fs.readFileSync(process.argv[2], 'utf8')));
          assert.equal(view.baseline.matches, true);
          assert.deepEqual(view.baseline.rows.map(r => r.receipt.gasUsed), ['0x5208', '0x5208']);
          assert.deepEqual(view.baseline.rows.map(r => r.receipt.cumulativeGasUsed), ['0x5208', '0xa410']);
          assert.deepEqual(view.candidate.rows.map(r => r.status), ['skipped', 'not_mined']);
          assert(view.candidate.rows.every(r => r.receipt === null));
          console.log(JSON.stringify({status: 'passed', artifact_id: view.report.artifact_id, node: process.version}));
          """
          completed = subprocess.run(['node', '--input-type=module', '-e', program,
                                      module.resolve().as_uri(), str(source)],
                                     check=True, capture_output=True, text=True, timeout=30)
          viewer = json.loads(completed.stdout)
          assert viewer['artifact_id'] == report.artifact_id
          out = Path('entrotter/evidence/bounded-agent-integration/integration-ci/trace-funding-reader.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({
              'status': 'passed', 'execution': 'offline synthetic report inspection; no new EVM/model call',
              'pins': json.loads(Path('entrotter/bounded-worker-pins.json').read_text()),
              'report_sha256': digest, 'artifact_id': report.artifact_id,
              'viewer_module_sha256': hashlib.sha256(module.read_bytes()).hexdigest(),
              'baseline_gas': [21000, 21000], 'baseline_cumulative_gas': [21000, 42000],
              'candidate_statuses': ['skipped', 'not_mined'], 'candidate_receipts': [None, None],
              'viewer': viewer,
              'limits': ['Native synthetic source; not archived funding or host default-worker execution proof.',
                         'Viewer codec inspection is separate from rendered browser verification.',
                         'Checksum/internal consistency is not authenticity/EVM truth.'],
          }, indent=2) + '\n')
          PY
      - name: Inspect oracle omission and unverified storage reports with SDK and viewer
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          from entrotter_sdk import load_trace
          sources = {
              'native-oracle-prefix.json': 'b97f34c9396f76eb352f870c0235422b77fa3aaaa58c25a97262c2995f2bd1ae',
              'native-provider-control.json': '66c1d555ad0068e128c8e5cdc0619f71824c4401177b0c3f1b84a77be4572b5d',
              'native-missing-storage.json': '2d1449f0807329e6f70799c0ff02ec69d2c8e1050c15425fd3f13aad034c034b',
          }
          module = Path('entrotter.github.io/trace-report.mjs')
          program = """
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const {validateTraceReport} = await import(process.argv[1]);
          const view = await validateTraceReport(JSON.parse(fs.readFileSync(process.argv[2], 'utf8')));
          const missing = process.argv[3] === 'true';
          assert.equal(view.baseline.matches, !missing);
          assert.deepEqual(view.baseline.rows.map(r => r.status), missing ? ['not_mined', 'not_mined'] : ['executed', 'executed']);
          assert.deepEqual(view.candidate.rows.map(r => r.status), missing ? ['skipped', 'not_mined'] : ['skipped', 'executed']);
          if (missing) {
            assert([...view.baseline.rows, ...view.candidate.rows].every(r => r.receipt === null));
          } else {
            assert.deepEqual(view.baseline.rows.map(r => parseInt(r.receipt.gasUsed, 16)), [26167, 26438]);
            assert.deepEqual(view.baseline.rows.map(r => parseInt(r.receipt.cumulativeGasUsed, 16)), [26167, 52605]);
            assert.equal(view.baseline.rows[1].receipt.logs[0].data, '0x' + (20n).toString(16).padStart(64, '0'));
            assert.equal(view.candidate.rows[1].receipt.status, '0x0');
            assert.equal(parseInt(view.candidate.rows[1].receipt.gasUsed, 16), 25808);
            assert.deepEqual(view.candidate.rows[1].receipt.logs, []);
          }
          console.log(JSON.stringify({status: 'passed', artifact_id: view.report.artifact_id, baseline_verified: view.baseline.matches, node: process.version}));
          """
          results = []
          for name, digest in sources.items():
              source = Path('engine/evidence/trace-oracle-provider') / name
              assert hashlib.sha256(source.read_bytes()).hexdigest() == digest
              report = load_trace(source)
              missing = name == 'native-missing-storage.json'
              assert report.baseline_verified == (not missing)
              assert [r.baseline.status for r in report.transactions] == (['not_mined', 'not_mined'] if missing else ['executed', 'executed'])
              assert [r.candidate.status for r in report.transactions] == (['skipped', 'not_mined'] if missing else ['skipped', 'executed'])
              if missing:
                  assert all(r.baseline.receipt is None and r.candidate.receipt is None for r in report.transactions)
              else:
                  assert [r.baseline.receipt.gas_used for r in report.transactions] == [26167, 26438]
                  assert [r.baseline.receipt.cumulative_gas_used for r in report.transactions] == [26167, 52605]
                  assert report.transactions[1].baseline.receipt.logs[0].data == '0x' + (20).to_bytes(32, 'big').hex()
                  adverse = report.transactions[1].candidate.receipt
                  assert adverse.status == 0 and adverse.gas_used == 25808 and not adverse.logs
                  assert report.transactions[1].candidate.hash == report.transactions[1].hash
              completed = subprocess.run(['node', '--input-type=module', '-e', program,
                                          module.resolve().as_uri(), str(source), str(missing).lower()],
                                         check=True, capture_output=True, text=True, timeout=30)
              viewer = json.loads(completed.stdout)
              assert viewer['artifact_id'] == report.artifact_id and viewer['baseline_verified'] == report.baseline_verified
              results.append({'source': str(source), 'report_sha256': digest,
                              'artifact_id': report.artifact_id, 'baseline_verified': report.baseline_verified,
                              'baseline_statuses': [r.baseline.status for r in report.transactions],
                              'candidate_statuses': [r.candidate.status for r in report.transactions], 'viewer': viewer})
          out = Path('entrotter/evidence/bounded-agent-integration/integration-ci/trace-oracle-reader.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({
              'status': 'passed', 'execution': 'offline synthetic oracle/provider-fault reports; no new EVM/model call',
              'pins': json.loads(Path('entrotter/bounded-worker-pins.json').read_text()),
              'viewer_module_sha256': hashlib.sha256(module.read_bytes()).hexdigest(), 'reports': results,
              'limits': ['Known storage-fault cause comes from separate test controls, not receipt absence.',
                         'Synthetic native source is not archived oracle or host default-worker proof.',
                         'Viewer codec inspection is separate from rendered browser verification.',
                         'Checksums/internal consistency do not authenticate provider state or oracle truth.'],
          }, indent=2) + '\n')
          PY
      - name: Inspect the supported observation wrapper with engine, SDK and viewer
        run: |
          python - <<'PY'
          from dataclasses import replace
          import hashlib, json, os, subprocess
          from pathlib import Path
          from entrotter_engine.consumer_observations import load_observed_trace
          from entrotter_engine.trace import write_trace
          from entrotter_sdk import load_trace
          source = Path('engine/evidence/owned-consumer-observations/historical-32/observed-trace.json')
          digest = '7010848300c353310fb78dab7f377daea4226633e49af3c1a384bcb3a579ba9d'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == digest
          observed = load_observed_trace(source)
          out = Path('entrotter/evidence/bounded-agent-integration/integration-ci/trace-observed-reader.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          os.environ['ENTROTTER_EXPORT_STATE_DIR'] = str(Path(os.environ.get('RUNNER_TEMP', '.quality')) / 'observed-reader-export-state')
          exported = out.with_name('observed-transaction-replay.json')
          write_trace(observed['trace_report'], exported)
          export_digest = hashlib.sha256(exported.read_bytes()).hexdigest()
          assert export_digest == '245d52672445bf16e8f19f685790e99f34e1a625a2aa5b98e5c36e15cbdfb82f'
          report = load_trace(exported)
          assert report.artifact_id == observed['trace_artifact_id']
          assert report.baseline_verified and len(report.transactions) == 32
          assert report.report['source']['block_transaction_count'] == 181
          assert report.report['plan']['through_index'] == 31 and report.report['plan']['skip_indices'] == [12]
          for i, row in enumerate(report.transactions):
              assert row.baseline.status == 'executed' and row.baseline.receipt == row.original_receipt
              if i == 12:
                  assert row.candidate.status == 'skipped' and row.candidate.receipt is None
              else:
                  expected = row.original_receipt if i < 12 else replace(
                      row.original_receipt,
                      transaction_index=row.original_receipt.transaction_index - 1,
                      cumulative_gas_used=row.original_receipt.cumulative_gas_used - 336752,
                  )
                  assert row.candidate.status == 'executed' and row.candidate.receipt == expected
                  assert row.candidate.differing_fields == (() if i < 12 else ('cumulativeGasUsed', 'transactionIndex'))
          prices = []
          for row, expected in zip(observed['observations'], [257082415000, 256292441874, 257082415000, 257082415000]):
              price = int(row['raw']['price'], 16)
              answer = int(row['raw']['latest_round_data'][66:130], 16)
              assert not row['errors'] and price == answer == expected
              assert int(row['raw']['base_currency'], 16) == 0 and int(row['raw']['base_unit'], 16) == 100000000
              prices.append({'branch': row['branch'], 'phase': row['phase'], 'consumer_price': price,
                             'producer_answer': answer, 'head': row['head'], 'code_identities': row['code']})
          assert observed['classification'] == {
              'complete_price_views': True, 'baseline_receipts_verified': True, 'unproven_reasons': [],
              'baseline_price': 256292441874, 'candidate_price': 257082415000, 'price_difference': 789973126,
          }
          module = Path('entrotter.github.io/trace-report.mjs')
          comparison = Path('entrotter.github.io/trace-comparison.mjs')
          observer_module = Path('entrotter.github.io/observed-trace.mjs')
          viewer_record = Path('entrotter.github.io/reports/trace-observed-price32.json')
          assert viewer_record.read_bytes() == source.read_bytes()
          program = """
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const {validateTraceReport} = await import(process.argv[1]);
          const {traceComparison} = await import(process.argv[2]);
          const view = await validateTraceReport(JSON.parse(fs.readFileSync(process.argv[3], 'utf8')));
          assert.equal(view.baseline.matches, true);
          assert.equal(view.candidate.rows.length, 32);
          const counts = {identical: 0, omitted: 0, structural: 0, execution: 0, unavailable: 0};
          const classifications = view.candidate.rows.map((row, i) => {
            const group = traceComparison(row);
            assert.equal(group.kind, i < 12 ? 'identical' : i === 12 ? 'omitted' : 'structural');
            assert.deepEqual(group.structuralFields, i > 12 ? ['cumulativeGasUsed', 'transactionIndex'] : []);
            assert.deepEqual(group.executionFields, []);
            counts[group.kind] += 1;
            return {index: row.index, status: row.status, ...group};
          });
          assert.deepEqual(counts, {identical: 12, omitted: 1, structural: 19, execution: 0, unavailable: 0});
          const {validateObservedTrace} = await import(process.argv[4]);
          const observed = await validateObservedTrace(fs.readFileSync(process.argv[5], 'utf8'));
          assert.equal(observed.trace.report.artifact_id, view.report.artifact_id);
          assert.deepEqual(observed.trace.report, view.report);
          const direct_observation = {
            artifact_id: observed.wrapper.artifact_id,
            trace_artifact_id: observed.trace.report.artifact_id,
            profile: observed.wrapper.profile,
            classification: observed.classification,
            phases: observed.wrapper.observations.map((row, i) => ({
              branch: row.branch, phase: row.phase,
              consumer_price: observed.phases[i].price,
              producer_answer: observed.phases[i].latest_round_data.answer,
              source: observed.phases[i].source, aggregator: observed.phases[i].aggregator,
              base_currency: observed.phases[i].base_currency, base_unit: observed.phases[i].base_unit,
              head: row.head, code_identities: row.code,
            })),
          };
          console.log(JSON.stringify({artifact_id: view.report.artifact_id, counts, classifications,
            node: process.version, direct_observation}, (_, value) => typeof value === 'bigint' ? value.toString() : value));
          """
          completed = subprocess.run(['node', '--input-type=module', '-e', program,
                                      module.resolve().as_uri(), comparison.resolve().as_uri(), str(exported),
                                      observer_module.resolve().as_uri(), str(viewer_record)],
                                     check=True, capture_output=True, text=True, timeout=30)
          viewer = json.loads(completed.stdout)
          direct = viewer.pop('direct_observation')
          assert viewer['artifact_id'] == report.artifact_id
          assert direct['artifact_id'] == observed['artifact_id'] and direct['trace_artifact_id'] == report.artifact_id
          assert direct['profile'] == observed['profile']
          assert direct['classification'] == {
              **observed['classification'], **{key: str(observed['classification'][key])
                  for key in ('baseline_price', 'candidate_price', 'price_difference')},
          }
          assert direct['phases'] == [{
              **price, 'consumer_price': str(price['consumer_price']), 'producer_answer': str(price['producer_answer']),
              'source': '0x' + row['raw']['source'][26:].lower(),
              'aggregator': '0x' + row['raw']['aggregator'][26:].lower(),
              'base_currency': '0x' + row['raw']['base_currency'][26:].lower(),
              'base_unit': str(int(row['raw']['base_unit'], 16)),
          } for price, row in zip(prices, observed['observations'])]
          out.write_text(json.dumps({
              'status': 'passed', 'execution': 'offline supported sealed wrapper to normal quota-bound report export, SDK and actual Node viewer; no fresh archive/EVM/model/browser call',
              'pins': json.loads(Path('entrotter/bounded-worker-pins.json').read_text()),
              'wrapper_sha256': digest, 'wrapper_artifact_id': observed['artifact_id'],
              'trace_artifact_id': report.artifact_id, 'export_sha256': export_digest,
              'baseline_receipts_equal_originals': 32, 'candidate_executed': 31, 'skip_indices': [12],
              'consumer_classification': observed['classification'], 'prices': prices,
              'viewer_module_sha256': hashlib.sha256(module.read_bytes()).hexdigest(),
              'comparison_module_sha256': hashlib.sha256(comparison.read_bytes()).hexdigest(), 'viewer': viewer,
              'observed_viewer_module_sha256': hashlib.sha256(observer_module.read_bytes()).hexdigest(),
              'viewer_observation': direct,
              'limits': ['Strict wrapper validation and offline parsing do not authenticate provider/deployed state.',
                         'Read-only price views are not signed consumer strategy or profit;32-of181 is not full-block/root/opcode proof.',
                         'SDK inspects the exported nested trace; the viewer codec additionally validates recorded wrapper price views.',
                         'Node codec checks are separate from rendered browser/Pages verification and real Docker execution.'],
          }, indent=2) + '\n')
          PY
      - name: Build source-bound local image
        run: |
          mkdir -p entrotter/evidence/bounded-agent-integration/integration-ci
          python engine/scripts/build_worker.py --output entrotter/evidence/bounded-agent-integration/integration-ci/image.json
          python - <<'PY'
          import json, os
          image = json.load(open('entrotter/evidence/bounded-agent-integration/integration-ci/image.json'))['image_id']
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ENTROTTER_WORKER_IMAGE=' + image + '\n')
              output.write('ENTROTTER_EXPORT_STATE_DIR=' + os.path.join(os.environ['RUNNER_TEMP'], 'entrotter-export-state') + '\n')
          PY
      - name: Verify shared daemon admission, default CLI-SDK-API, preservation and quotas
        run: python entrotter/scripts/check_host_limits.py --worker-manifest entrotter/evidence/bounded-agent-integration/integration-ci/image.json --output entrotter/evidence/bounded-agent-integration/integration-ci/integration.json
      - name: Verify shared export accounting across real CLI processes
        run: python entrotter/scripts/check_export_budget.py --output entrotter/evidence/bounded-agent-integration/integration-ci/export-contract.json
      - name: Verify export failures still reject under Python optimization
        run: python -O entrotter/scripts/check_export_budget.py --output entrotter/evidence/bounded-agent-integration/integration-ci/optimized-export-contract.json
      - name: Measure a clean public checkout with the bounded default
        run: python entrotter/scripts/reproduce_clean.py --bounded --output entrotter/evidence/bounded-agent-integration/integration-ci/clean-fixture.json
      - name: Measure clean public bounded agent replay and standalone CLI verification
        run: python entrotter/scripts/reproduce_clean.py --bounded-agent --output entrotter/evidence/bounded-agent-integration/integration-ci/clean-agent.json
      - name: Verify no owned worker remains
        if: always()
        run: |
          workers=$(docker ps --all --filter label=org.entrotter.worker=true --format '{{.ID}}')
          test -z "$workers"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coordination-integration-evidence
          path: |
            entrotter/evidence/bounded-agent-integration/integration-ci/
          if-no-files-found: error
