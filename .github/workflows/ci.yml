              assert not row.candidate.differing_fields
          assert position.prices.report == raw['price_report']
          assert position.prices.trace.report == trace
          assert [row.price for row in position.prices.observations] == [257082415000, 256292441874, 257082415000, 257082415000]
          assert position.prices.classification.price_difference == 789973126
          classification = json.loads(json.dumps(asdict(position.classification)))
          assert classification == raw['classification'] == classify(raw['observations'], raw['price_report'])
          assert classification['complete_account_views'] and classification['unproven_reasons'] == []
          assert classification['base_unit'] == 100000000 and classification['health_factor_unit'] == 10**18
          assert classification['baseline_health_status'] == classification['candidate_health_status'] == 'at_or_above_one'
          fields = ('total_collateral_base', 'total_debt_base', 'available_borrows_base', 'liquidation_threshold_bps', 'ltv_bps', 'health_factor_wad')
          baseline = (41049031017510, 16199140199548, 16845329769548, 8300, 8050, 2103240994573506125)
          candidate = (41175556915484, 16219364581293, 16926958735672, 8300, 8050, 2107093164381383462)
          assert classification['baseline'] == dict(zip(fields, baseline))
          assert classification['candidate'] == dict(zip(fields, candidate))
          assert classification['differences'] == dict(zip(fields, (126525897974, 20224381745, 81628966124, 0, 0, 3852169807877337)))
          phases = json.loads(json.dumps([asdict(row) for row in position.observations]))
          for i, (row, recorded) in enumerate(zip(phases, raw['observations'])):
              assert row['branch'] == recorded['branch'] and row['phase'] == recorded['phase']
              assert row['account'] == position.account and row['head'] == recorded['head']
              assert row['head'] == raw['price_report']['observations'][i]['head']
              assert row['values'] == decode_account(recorded['raw'])
              assert row['provider'] == '0x2f39d218133afab8f2b819b1066c7e434ad94e9e' == '0x' + recorded['provider'][26:]
              assert row['oracle'] == '0x54586be62e3c3580375ae3723c145253060ca0c2' == '0x' + recorded['oracle'][26:]
              assert row['pool_code'] == recorded['code'] and row['pool_code']['bytes'] > 0
              assert row['errors'] == []
          assert phases[0]['values'] == phases[2]['values']
          assert all(row['pool_code'] == phases[0]['pool_code'] for row in phases)
          cli = {}
          for command in ('position-verify', 'position-inspect'):
              completed = subprocess.run([sys.executable, '-m', 'entrotter_cli', command, str(source)],
                                         check=True, capture_output=True, text=True, timeout=30)
              assert completed.stderr == ''
              cli[command] = json.loads(completed.stdout)
          verified, inspected = cli['position-verify'], cli['position-inspect']
          assert verified['artifact_id'] == position.artifact_id and verified['account'] == position.account
          assert verified['integrity_verified'] is True and verified['profile'] == position.profile
          assert verified['classification'] == classification
          assert verified['plan'] == position.plan and verified['scope'] == raw['scope']
          assert verified['prices'] == {'artifact_id': position.prices.artifact_id, 'classification': json.loads(json.dumps(asdict(position.prices.classification)))}
          assert verified['trace'] == {'artifact_id': position.trace.artifact_id, 'baseline_receipts_verified': True, 'transaction_count': 13}
          assert 'observations' not in verified
          assert {k: v for k, v in inspected.items() if k not in ('observations', 'price_observations')} == verified
          assert inspected['observations'] == phases
          assert inspected['price_observations'] == json.loads(json.dumps([asdict(row) for row in position.prices.observations]))
          out = Path('entrotter/evidence/bounded-agent-integration/integration-ci/account-position-reader.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          modules = ('engine/src/entrotter_engine/position_observations.py', 'sdk-python/src/entrotter_sdk/position.py', 'cli/src/entrotter_cli/main.py')
          out.write_text(json.dumps({
              'status': 'passed', 'execution': 'Offline full Engine/SDK/CLI consistency inspection; no new chain/model/browser execution.',
              'pins': json.loads(Path('entrotter/bounded-worker-pins.json').read_text()),
              'wrapper_sha256': digest, 'artifact_id': position.artifact_id,
              'price_artifact_id': position.prices.artifact_id, 'trace_artifact_id': position.trace.artifact_id,
              'baseline_receipts_equal_originals': 13, 'candidate_executed': 12, 'skip_indices': [12],
              'account': position.account, 'classification': classification,
              'account_phases': phases, 'price_classification': json.loads(json.dumps(asdict(position.prices.classification))),
              'price_phases': json.loads(json.dumps([asdict(row) for row in position.prices.observations])),
              'cli': cli, 'module_sha256': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in modules},
              'limits': ['Read-only aggregate account difference includes all prefix effects, not sole-price causality.',
